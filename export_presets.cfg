[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/*.txt"
exclude_filter="tests/*,tools/*,docs/*,builds/*,.tools/*,README.md"
export_path="builds/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.tools/web_nothreads_debug.zip"
custom_template/release="res://.tools/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"Re:boot — przywróć fabrykę do życia. Przeglądarkowy etap 1: hala i konsola serwisowa.\">"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
